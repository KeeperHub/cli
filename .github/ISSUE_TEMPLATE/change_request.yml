name: Behaviour change or new command
description: Propose something kh should do that it does not do today.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lead with what you are trying to do, not with what to build. Wait for the
        `accepted` label before writing code - see
        [ISSUES.md](https://github.com/KeeperHub/cli/blob/main/ISSUES.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched open and closed issues for this proposal.
          required: true
        - label: I checked `kh <command> --help` and the command reference.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What you cannot do today
      description: >-
        The concrete task that is blocked or awkward, and what you do instead. If
        a flag nearly does it, say what it falls short on.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: >-
        The command or flag as you would build it, including its output shape and
        exit codes. Say what happens to callers of the current behaviour.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: >-
        What this touches and what it does not. Then apply the split test: can
        each piece ship and be correct with the others reverted? If yes, they are
        separate issues - list them and file the rest separately.
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This changes existing output, an exit code, or a flag's meaning.
          required: false
        - label: This changes a default for callers who pass no flags.
          required: false
        - label: This adds or upgrades a Go module dependency.
          required: false
        - label: This touches authentication or credential storage.
          required: false
